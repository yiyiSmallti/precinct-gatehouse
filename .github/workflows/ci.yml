name: ci
# Runs on pull requests only, and not for documentation-only changes.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "e2e/report/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: end-to-end (G1–G4, G6, redaction fixtures)
        run: go test -count=1 -v ./e2e/
      - name: cross-build
        env:
          CGO_ENABLED: "0"
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/gatehouse
            echo "built $t"
          done
      - name: NER plugin (cgo, linux/amd64; G19 needs the model and runs locally)
        working-directory: plugins/astrlink-detector
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          go build -trimpath -ldflags "-s -w" -o astrlink-detector-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: astrlink-detector-linux-amd64
          path: plugins/astrlink-detector/astrlink-detector-linux-amd64
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e/report/
